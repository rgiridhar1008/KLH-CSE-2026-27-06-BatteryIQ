# BatteryIQ research pipeline configuration.
# Screening thresholds are engineering defaults for demonstration only; they
# are not claimed to be scientifically optimal.
window_size: 50
window_step: 50

# Earliest contiguous samples used to build each (directory, battery_id)
# normal baseline. This is an exploratory default, not a validated choice.
baseline:
  strategy: initial
  samples: 1000

screening:
  trigger_threshold: 1.0
  min_trigger_windows: 1
  cooldown_windows: 0
  weights:
    voltage: 1.0
    current: 1.0
    temperature: 1.0

  # Legacy absolute feature thresholds retained for the original runner.
  # The baseline-relative evaluator above uses normalized deviations.
  thresholds:
    voltage_spread: 0.05
    voltage_spread_change: 0.02
    current_change: 25.0
    current_rate: 25.0
    temperature_spread: 5.0
    temperature_change: 3.0
    temperature_rate: 3.0
    voltage_rate: 0.02
  min_triggered_features: 1
  score_threshold: 1.0
